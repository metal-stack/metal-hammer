name: Build

on:
  pull_request:
    branches:
      - master
  release:
    types:
      - published
  push:
    branches:
      - master

jobs:
  draft:
    uses: metal-stack/actions-common/.github/workflows/release-drafter.yaml@v1

  build:
    runs-on: ubuntu-latest
    outputs:
      build-artifacts: ${{ steps.artifact-upload-step.outputs.artifact-id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build image
        run: |
          make metal-hammer-initrd.img.lz4

      - uses: actions/upload-artifact@v7
        id: artifact-upload-step
        with:
          name: go-build-artifact
          path: |
            metal-hammer-initrd.img.lz4
            metal-hammer-initrd.img.lz4.md5
          if-no-files-found: error
          retention-days: 1

  gcp-bucket-push:
    uses: metal-stack/actions-common/.github/workflows/gcp-bucket-push.yaml@v1
    secrets: inherit
    needs:
      - build
    with:
      artifact-ids: ${{ needs.build.outputs.build-artifacts }}
      bucket: images.metal-pod.io
      default-branch-folder: latest

  release-assets:
    uses: metal-stack/actions-common/.github/workflows/release-assets.yaml@v1
    needs:
      - build
    with:
      artifact-ids: ${{ needs.build.outputs.build-artifacts }}
      files: |
        metal-hammer-initrd.img.lz4
        metal-hammer-initrd.img.lz4.md5
